# /opt/airflow/include/soda/checks.yml

for each dataset:
  datasets:
    - YT_API
  checks:
    # Row and identity validation
    - row_count > 0
    - missing_count("Video_id") = 0
    - duplicate_count("Video_id") = 0
    - missing_count("Video_title") = 0
    - missing_count("Published_at") = 0

    # Numeric metrics validation
    - min("View_count") >= 0
    - min("Like_count") >= 0
    - min("Comment_count") >= 0

# Core-specific validation (runs only when scanning CORE)
checks for YT_API:
  - invalid_count("Video_type") = 0:
      valid values: ['Normal', 'Short']
      filter: SCHEMA = 'CORE'